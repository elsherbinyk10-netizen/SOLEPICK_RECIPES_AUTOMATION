name: Build multilingual recipe content and video candidates
on:
  workflow_dispatch:
    inputs:
      confirm_services:
        description: Confirm GOOGLE_TRANSLATE_API_KEY is set in Actions secrets and YouTube video matching is for review
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: solepick-localized-recipe-media
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm_services == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video search dependency
        run: python -m pip install yt-dlp
      - name: Build resumable recipe translations
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python translate_recipe_library.py
      - name: Find and validate language-matched video candidates
        run: python build_localized_recipe_videos.py
      - name: Commit cache and video candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localized_recipes.json localized_recipe_videos.json
          if git diff --cached --quiet; then
            echo "No new localized data or video candidates."
          else
            git commit -m "Build localized recipe content and video candidates"
            git push
          fi
