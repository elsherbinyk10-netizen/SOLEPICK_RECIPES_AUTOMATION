name: Build multilingual recipe video candidates (no API key)
on:
  workflow_dispatch:
    inputs:
      confirm_services:
        description: Confirm that this creates candidate links for manual review only; it does not publish videos
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: solepick-localized-recipe-media
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm_services == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video search dependency
        run: python -m pip install yt-dlp
      - name: Find candidate videos for recipe languages (no translation API)
        run: python build_localized_recipe_videos.py
      - name: Commit candidate catalogue for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localized_recipe_videos.json
          if git diff --cached --quiet; then
            echo "No new candidate data."
          else
            git commit -m "Build no-key multilingual recipe video candidates"
            git push
          fi
