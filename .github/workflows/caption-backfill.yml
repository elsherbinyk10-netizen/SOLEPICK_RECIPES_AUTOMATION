name: SolePick Recipe Caption Backfill

on:
  push:
    branches: [main]
    paths:
      - 'caption_backfill.py'
      - 'generate_captions.py'
      - 'translate_captions.py'
      - '.github/workflows/caption-backfill.yml'
  workflow_run:
    workflows: ["SolePick Daily Recipe Publishing"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Daily safety sweep; workflow_run also scans immediately after daily publishing finishes.
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: solepick-caption-backfill
  cancel-in-progress: false

jobs:
  caption-backfill:
    # Avoid a loop: this workflow commits caption files, which triggers the daily workflow's push/test run.
    # Only re-run on workflow_run after the daily publisher actually ran by schedule or manual dispatch.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install caption and translation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp faster-whisper argostranslate

      - name: Validate Python scripts
        run: python -m compileall -q caption_backfill.py generate_captions.py translate_captions.py recipe_worker.py

      - name: Discover existing recipe videos and generate available captions
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
        run: python caption_backfill.py

      - name: Commit generated and validated caption files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions caption-backfill-report.json
          if git diff --cached --quiet; then
            echo "No new caption files or report changes to commit."
          else
            git commit -m "Backfill validated recipe video captions"
            git push
          fi
