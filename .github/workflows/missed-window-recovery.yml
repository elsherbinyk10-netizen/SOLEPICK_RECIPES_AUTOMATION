name: SolePick Missed-Window Recovery

on:
  schedule:
    # Fifteen-minute watchdog after the five UTC hours covering Cairo's
    # four local windows in both UTC+2 and UTC+3 seasons. The script
    # ignores the one seasonal off-window tick.
    - cron: "15 6-11 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: solepick-schedule-watchdog
  cancel-in-progress: false

jobs:
  recover-missed-window:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Recover only when this Cairo window has no successful scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          now = datetime.datetime.now(datetime.timezone.utc)
          cairo = now.astimezone(ZoneInfo("Africa/Cairo"))

          # Fifteen-minute checks follow each approved local publishing hour.
          # GitHub may queue scheduled events many hours late. Keep a guarded
          # final catch-up eligible after 13:15 Cairo instead of discarding a
          # delayed tick; the publisher still enforces quality and the 3/day cap.
          if cairo.hour < 9 or (cairo.hour <= 13 and cairo.minute < 15):
              print(f"Outside recovery window: Cairo {cairo:%H:%M}; no dispatch.")
              sys.exit(0)

          final_catchup = cairo.hour >= 13
          window_start = now.replace(minute=0, second=0, microsecond=0)
          start_text = window_start.isoformat().replace("+00:00", "Z")
          day_start_text = (
              cairo.replace(hour=0, minute=0, second=0, microsecond=0)
              .astimezone(datetime.timezone.utc)
              .isoformat()
              .replace("+00:00", "Z")
          )
          api = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          request = urllib.request.Request(
              api,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))

          matching = [
              run for run in payload.get("workflow_runs", [])
              if run.get("path") == ".github/workflows/daily-recipes.yml"
              and run.get("head_branch") == "main"
              and (
                  (
                      final_catchup
                      and run.get("created_at", "") >= day_start_text
                      and (
                          run.get("event") in ("schedule", "workflow_dispatch")
                          or (
                              run.get("event") == "push"
                              and "[publish-daily-recipe]" in ((run.get("head_commit") or {}).get("message", ""))
                          )
                      )
                  )
                  or (
                      not final_catchup
                      and run.get("event") == "schedule"
                      and run.get("created_at", "") >= start_text
                  )
              )
          ]
          # A completed workflow can be green while publishing zero recipes
          # (for example, when all image/video candidates are correctly held).
          # For the final catch-up, only an active run should suppress dispatch;
          # the publisher re-reads Shopify and its Cairo-day idempotency guard
          # prevents duplicates and stops once the 3-recipe cap is reached.
          healthy_or_running = [
              run for run in matching
              if run.get("status") in ("queued", "in_progress")
              or (
                  not final_catchup
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              )
          ]
          if healthy_or_running:
              run = healthy_or_running[0]
              window_label = "this Cairo day" if final_catchup else "this UTC window"
              print(
                  f"A healthy or active publishing run already exists for {window_label}: "
                  f"id={run.get('id')} status={run.get('status')} "
                  f"conclusion={run.get('conclusion')}; no recovery dispatch."
              )
              sys.exit(0)

          reason = (
              "final 13:15 Cairo catch-up; publisher will fill only remaining daily slots"
              if final_catchup else
              f"no successful or active scheduled run found for Cairo {cairo:%Y-%m-%d %H}:00"
          )
          print(f"{reason}. Dispatching guarded recovery.")
          dispatch_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "daily-recipes.yml/dispatches"
          )
          body = json.dumps({
              "ref": "main",
              "inputs": {
                  "max_recipes": "3",
                  "audit_missing_videos": "true",
              },
          }).encode("utf-8")
          dispatch = urllib.request.Request(
              dispatch_url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(dispatch, timeout=20) as response:
                  print(f"Recovery dispatch accepted: HTTP {response.status}.")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")
              raise RuntimeError(
                  f"GitHub rejected the recovery dispatch: HTTP {error.code}: {detail}"
              )
          PY
