name: SolePick Daily Recipe Exposure Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "google_performance.py"
      - "exposure_pack.py"
      - "requirements.txt"
      - ".github/workflows/daily-exposure.yml"
  schedule:
    - cron: "45 17 * * *" # 19:45 Cairo during UTC+2

permissions:
  contents: read

concurrency:
  group: solepick-exposure-pack
  cancel-in-progress: false

jobs:
  build-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Google reporting dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-analytics-data
      - name: Validate exposure generator
        run: python -m py_compile exposure_pack.py recipe_worker.py
      - name: Build SEO audit and social-ready copy for latest published recipes
        run: python exposure_pack.py --limit 10
      - name: Import Google Search Console and GA4 performance (skips safely until connected)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python google_performance.py
      - name: Upload daily exposure pack
        uses: actions/upload-artifact@v4
        with:
          name: solepick-exposure-${{ github.run_number }}
          path: exposure_output/
          if-no-files-found: error
          retention-days: 30
