name: Build multilingual recipe translation cache
on:
  workflow_dispatch:
    inputs:
      confirm_api_key:
        description: Confirm GOOGLE_TRANSLATE_API_KEY is configured in repository secrets
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: solepick-translation-cache
  cancel-in-progress: false
jobs:
  translate:
    if: inputs.confirm_api_key == true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build resumable translation cache
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python translate_recipe_library.py
      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localized_recipes.json
          if git diff --cached --quiet; then
            echo "No new translations."
          else
            git commit -m "Build multilingual recipe translation cache"
            git push
          fi
