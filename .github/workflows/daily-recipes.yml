name: SolePick Daily Recipe Publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_handle:
        description: "Optional: repair video on an existing published article (example: honey-mustard-salmon-stuffed-sweet-potatoes)"
        required: false
        type: string
        default: ""
      one_time_test:
        description: "One-time manual test: publish one eligible new recipe even if today already has a post. Normal daily duplicate protection stays enabled."
        required: false
        type: boolean
        default: false
  schedule:
    # Cairo is UTC+2 after the 2026 daylight-saving transition:
    # 07:00 UTC = 09:00 Cairo (early guard/recovery), 08:00 UTC = 10:00 Cairo (primary).
    # 09:00 and 10:00 UTC are same-day recovery checks if GitHub delays/drops earlier runs.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    # Additional same-day catch-up if GitHub drops or delays all earlier triggers.
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: solepick-daily-recipe-publishing
  cancel-in-progress: false

jobs:
  publish-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install no-key video search dependency
        run: |
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check yt-dlp && exit 0
            echo "yt-dlp install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1

      # HARD QUALITY GATE: every recipe, image-relevance, retail-shelf,
      # duplicate-image, document/PDF and video regression test must pass
      # before any scheduled or manual Shopify publishing step can run.
      - name: Validate recipe library and media safety (required before publishing)
        run: python -m unittest discover -s tests -v

      - name: Install open-source caption tools
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y ffmpeg && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "ffmpeg package install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check faster-whisper && exit 0
            echo "faster-whisper install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1

      - name: Publish daily Shopify recipe
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[repair-video:') || contains(github.event.head_commit.message, '[publish-daily-recipe]'))))
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          MAX_RECIPES_PER_RUN: '3'
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REPAIR_HANDLE: ${{ inputs.repair_handle }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ONE_TIME_TEST: ${{ inputs.one_time_test || false }}
          # For an explicitly marked one-time publish, let the worker select today's eligible recipe; do not hard-code yesterday's recipe slug.
          TARGET_RECIPE_SLUG: ''
        run: |
          # Allow a narrowly scoped video repair from a commit message such as
          # [repair-video:black-bean-corn-loaded-salad], without publishing a new article.
          # Targeted repair dispatches preserve the existing recipe and update only its video. Mobile embed visibility fix applied. [repair-video:black-bean-corn-loaded-salad]
          # One-time duplicate-guard bypass is available only through an explicit manual workflow_dispatch input.
          if [[ -z "$REPAIR_HANDLE" && "$COMMIT_MESSAGE" =~ \[repair-video:([a-z0-9-]+)\] ]]; then
            REPAIR_HANDLE="${BASH_REMATCH[1]}"
          fi
          # Seasonal primary triggers plus a daily recovery trigger protect
          # against GitHub dropping a scheduled run. Cairo-day idempotency
          # prevents duplicate recipe publication.
          if [[ -n "$REPAIR_HANDLE" && "$ONE_TIME_TEST" == "true" ]]; then
            echo "Choose either repair_handle or one_time_test, not both."
            exit 2
          elif [[ -n "$REPAIR_HANDLE" ]]; then
            command=(python recipe_worker.py --repair-handle "$REPAIR_HANDLE")
          elif [[ "$ONE_TIME_TEST" == "true" ]]; then
            command=(python recipe_worker.py --one-time-test)
          else
            command=(python recipe_worker.py)
          fi

          # Retry transient network/API/search failures. The worker's Cairo-day
          # idempotency guard prevents a retry from creating a second daily post.
          for attempt in 1 2 3; do
            if "${command[@]}"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Publishing attempt $attempt failed (exit $status); retrying in 45 seconds."
              sleep 45
            else
              echo "Publishing failed after 3 attempts."
              exit "$status"
            fi
          done
