name: SolePick Daily Recipe Publishing

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 10:00 AM Egypt time during UTC+3
    - cron: "0 7 * * *"
    # 10:00 AM Egypt time during UTC+2
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: solepick-daily-recipe-publishing
  cancel-in-progress: false

jobs:
  publish-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install no-key video search dependency
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Validate recipe library
        run: python -m unittest discover -s tests -v

      - name: Publish daily Shopify recipe
        if: github.event_name != 'push'
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python recipe_worker.py
