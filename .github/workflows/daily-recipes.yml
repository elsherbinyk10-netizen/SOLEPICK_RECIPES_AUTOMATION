name: SolePick Daily Recipe Publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_handle:
        description: "Optional: repair video on an existing published article (example: honey-mustard-salmon-stuffed-sweet-potatoes)"
        required: false
        type: string
        default: ""
      one_time_test:
        description: "One-time manual test: publish one eligible new recipe even if today already has a post. Normal daily duplicate protection stays enabled."
        required: false
        type: boolean
        default: false
  schedule:
    # Run once daily at 07:00 UTC (10:00 AM Cairo during UTC+3,
    # 09:00 AM Cairo during UTC+2). One fixed trigger avoids seasonal
    # duplicate/skip behavior and keeps daily publishing predictable.
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: solepick-daily-recipe-publishing
  cancel-in-progress: false

jobs:
  publish-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install no-key video search dependency
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Validate recipe library
        run: python -m unittest discover -s tests -v

      - name: Install open-source caption tools
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper

      - name: Publish daily Shopify recipe
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-today-solepick]'))
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPAIR_HANDLE: ${{ inputs.repair_handle }}
          ONE_TIME_TEST: ${{ inputs.one_time_test || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-today-solepick]')) }}
          TARGET_RECIPE_SLUG: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-today-solepick]') && 'creamy-lemon-garlic-chicken-orzo' || '' }}
        run: |
          # The single daily UTC trigger is intentional. Cairo local time shifts
          # by one hour seasonally; publishing remains once daily without a
          # second off-season cron that can be skipped or confuse monitoring.
          if [[ -n "$REPAIR_HANDLE" && "$ONE_TIME_TEST" == "true" ]]; then
            echo "Choose either repair_handle or one_time_test, not both."
            exit 2
          elif [[ -n "$REPAIR_HANDLE" ]]; then
            python recipe_worker.py --repair-handle "$REPAIR_HANDLE"
          elif [[ "$ONE_TIME_TEST" == "true" ]]; then
            python recipe_worker.py --one-time-test
          else
            python recipe_worker.py
          fi
