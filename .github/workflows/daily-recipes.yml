name: SolePick Daily Recipe Publishing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_handle:
        description: "Optional: repair video on an existing published article (example: cajun-shrimp-tacos-zesty-lime-slaw)"
        required: false
        type: string
        default: ""
      one_time_test:
        description: "One-time manual test: publish one eligible new recipe even if today already has a post. Normal daily duplicate protection stays enabled."
        required: false
        type: boolean
        default: false
  schedule:
    # 10:00 AM Egypt time during UTC+3
    - cron: "0 7 * * *"
    # 10:00 AM Egypt time during UTC+2
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: solepick-daily-recipe-publishing
  cancel-in-progress: false

jobs:
  publish-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install no-key video search dependency
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Validate recipe library
        run: python -m unittest discover -s tests -v

      - name: Publish daily Shopify recipe
        if: github.event_name != 'push'
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPAIR_HANDLE: ${{ inputs.repair_handle }}
          ONE_TIME_TEST: ${{ inputs.one_time_test }}
        run: |
          # Both UTC cron entries cover Egypt seasonal time changes; publish only on the matching one.
          if [[ -n "$GITHUB_EVENT_SCHEDULE" ]]; then
            expected_cron="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; offset=datetime.now(ZoneInfo("Africa/Cairo")).utcoffset().total_seconds(); print("0 7 * * *" if offset == 10800 else "0 8 * * *")')"
            if [[ "$GITHUB_EVENT_SCHEDULE" != "$expected_cron" ]]; then
              echo "Skipping duplicate seasonal schedule entry; expected $expected_cron for Africa/Cairo."
              exit 0
            fi
          fi
          if [[ -n "$REPAIR_HANDLE" && "$ONE_TIME_TEST" == "true" ]]; then
            echo "Choose either repair_handle or one_time_test, not both."
            exit 2
          elif [[ -n "$REPAIR_HANDLE" ]]; then
            python recipe_worker.py --repair-handle "$REPAIR_HANDLE"
          elif [[ "$ONE_TIME_TEST" == "true" ]]; then
            python recipe_worker.py --one-time-test
          else
            python recipe_worker.py
          fi
