name: SolePick Daily Recipe Publishing
# Scheduled daily trend refresh plus verified, serialized recipe publishing; no unverified media is published.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_handle:
        description: "Optional: repair video on an existing published article (example: honey-mustard-salmon-stuffed-sweet-potatoes)"
        required: false
        type: string
        default: ""
      recipe_slugs:
        description: "Optional comma-separated recipe slugs to publish in order. Each still must pass all quality checks."
        required: false
        type: string
        default: ""
      max_recipes:
        description: "Maximum verified recipes for this run (1-3)."
        required: false
        type: choice
        options: ["1", "2", "3"]
        default: "3"
      audit_missing_videos:
        description: "Audit published recipe articles, repair missing embedded videos, then publish one only if today's recipe is missing."
        required: false
        type: boolean
        default: false
      one_time_test:
        description: "One-time test: publish exactly one eligible recipe even if today already has a post. Normal duplicate protection stays enabled."
        required: false
        type: boolean
        default: false
  schedule:
    # Four approved publishing windows (09:00–12:00 Cairo) plus a 13:00 Cairo recovery pass.
    # The recovery pass retries only if the daily target has not been met; Shopify idempotency prevents duplicates.
    # Cairo summer (UTC+3): 06:00–10:00 UTC; winter (UTC+2): 07:00–11:00 UTC.
    # The union below covers both offsets; the worker ignores off-season cron hours.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: write

# Keep scheduled ticks serialized, but give each explicit push/manual recovery
# run its own queue key so a stale skipped push cannot block a real publish run.
concurrency:
  # Scheduled ticks share one lock so the same Cairo day cannot race.
  # Each reviewed recovery commit has its own lock so a stalled older runner
  # cannot block the fresh code path from making progress.
  group: solepick-daily-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'scheduled' || github.sha }}
  cancel-in-progress: false

jobs:
  publish-recipe:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[repair-video:') || contains(github.event.head_commit.message, '[audit-repair-videos]') || contains(github.event.head_commit.message, '[publish-daily-recipe]') || contains(github.event.head_commit.message, '[validate-recipe-library]') || contains(github.event.head_commit.message, '[check-recipe-media]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install no-key video search dependency
        run: |
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check yt-dlp && exit 0
            echo "yt-dlp install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1

      - name: Install Pillow for image quality validation
        run: python -m pip install --disable-pip-version-check "Pillow>=11.0.0,<13"

      # HARD QUALITY GATE: every recipe, image-relevance, retail-shelf,
      # duplicate-image, document/PDF and video regression test must pass
      # before any scheduled or manual Shopify publishing step can run.
      - name: Validate recipe library and media safety (required before publishing)
        run: python -m unittest discover -s tests -v

      - name: Check media for replenished recipes without publishing
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[check-recipe-media]')
        env:
          MEDIA_CHECK_SLUGS: thanksgiving-breakfast-casserole,creamy-mashed-potatoes
        run: python recipe_worker.py --check-media-only

      - name: Install open-source caption tools
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y ffmpeg && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "ffmpeg package install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          for attempt in 1 2 3; do
            python -m pip install --disable-pip-version-check faster-whisper && exit 0
            echo "faster-whisper install attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1

      - name: Publish daily Shopify recipe
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[repair-video:') || contains(github.event.head_commit.message, '[audit-repair-videos]') || contains(github.event.head_commit.message, '[publish-daily-recipe]'))))
        env:
          SHOPIFY_STORE_DOMAIN: 0mxbjk-cz.myshopify.com # Verified SolePick Recipes store; do not point this workflow at Valuted News.
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          MAX_RECIPES_PER_RUN: ${{ inputs.max_recipes || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-one-recipe]') && '1') || '3' }}
          TARGET_RECIPE_SLUGS: ${{ inputs.recipe_slugs || '' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REPAIR_HANDLE: ${{ inputs.repair_handle }}
          AUDIT_MISSING_VIDEOS: ${{ inputs.audit_missing_videos || false }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ONE_TIME_TEST: ${{ inputs.one_time_test || false }}
          # For an explicitly marked one-time publish, let the worker select today's eligible recipe; do not hard-code yesterday's recipe slug.
          TARGET_RECIPE_SLUG: ''
        run: |
          # Allow a narrowly scoped video repair from a commit message such as
          # [repair-video:black-bean-corn-loaded-salad], without publishing a new article.
          # Targeted repair dispatches preserve the existing recipe and update only its video. Mobile embed visibility fix applied. [repair-video:black-bean-corn-loaded-salad]
          # One-time duplicate-guard bypass is available only through an explicit manual workflow_dispatch input.
          if [[ -z "$REPAIR_HANDLE" && "$COMMIT_MESSAGE" =~ \[repair-video:([a-z0-9-]+)\] ]]; then
            REPAIR_HANDLE="${BASH_REMATCH[1]}"
          fi
          # An explicit commit marker can request a reviewed batch of recipe slugs.
          # Read the push commit message from the event payload as a reliable
          # fallback; this also makes the one-recipe marker work if the step
          # environment did not receive the expression value.
          if [[ -z "$COMMIT_MESSAGE" && -n "${GITHUB_EVENT_PATH:-}" ]]; then
            COMMIT_MESSAGE="$(python -c 'import json,os; print((json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("head_commit") or {}).get("message", ""))')"
          fi
          if [[ -z "$TARGET_RECIPE_SLUGS" && "$COMMIT_MESSAGE" =~ \[publish-recipes:([a-z0-9,-]+)\] ]]; then
            TARGET_RECIPE_SLUGS="${BASH_REMATCH[1]}"
            export TARGET_RECIPE_SLUGS
          fi
          echo "Resolved targeted recipe slugs: ${TARGET_RECIPE_SLUGS:-<none>}"
          # Seasonal primary triggers plus a daily recovery trigger protect
          # against GitHub dropping a scheduled run. Cairo-day idempotency
          # prevents duplicate recipe publication.
          if [[ -n "$REPAIR_HANDLE" && "$ONE_TIME_TEST" == "true" ]]; then
            echo "Choose either repair_handle or one_time_test, not both."
            exit 2
          elif [[ -n "$REPAIR_HANDLE" ]]; then
            command=(python recipe_worker.py --repair-handle "$REPAIR_HANDLE")
          elif [[ "$ONE_TIME_TEST" == "true" ]]; then
            command=(python recipe_worker.py --one-time-test)
          else
            # Audit existing published embeds first, then continue into the
            # guarded daily/targeted publisher instead of exiting after audit.
            if [[ "$AUDIT_MISSING_VIDEOS" == "true" || "$COMMIT_MESSAGE" == *"[audit-repair-videos]"* ]]; then
              python recipe_worker.py --audit-missing-videos
            fi
            command=(python recipe_worker.py)
          fi

          # Retry transient network/API/search failures. The worker's Cairo-day
          # idempotency guard prevents a retry from creating a second daily post.
          for attempt in 1 2 3; do
            if "${command[@]}"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Publishing attempt $attempt failed (exit $status); retrying in 45 seconds."
              sleep 45
            else
              echo "Publishing failed after 3 attempts."
              exit "$status"
            fi
          done

      - name: Persist newly generated trend recipes
        if: always() && github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- recipes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recipes.json
            git commit -m "Persist new SolePick trend recipes [recipe-library-update]"
            git push
            echo "New trend-matched recipe candidates saved for future daily runs."
          else
            echo "No new trend recipes to persist."
          fi
# 2026-11-15 recovery trigger: comment-only commit to retry today's guarded publisher after missing scheduled ticks.
# Manual recovery trigger: rerun the existing guarded daily publisher after missed Cairo schedule windows.
# Missed-window watchdog installed; guarded current-day recovery [publish-daily-recipe]
# 2026-11-20 guarded same-day recovery trigger (comment-only; quality gates unchanged).
# 2026-11-21 guarded same-day recovery trigger [publish-daily-recipe]
# 2026-11-23 same-Cairo-day guarded recovery: retry after the off-season 06:00 UTC cron was correctly rejected.
# 2026-11-24 guarded same-Cairo-day recovery after missed 09:00–12:00 Cairo publishing windows; quality gates and duplicate guard unchanged.
# 2026-11-25 same-Cairo-day guarded recovery after missing scheduled publisher ticks; quality gates and duplicate guard unchanged.
