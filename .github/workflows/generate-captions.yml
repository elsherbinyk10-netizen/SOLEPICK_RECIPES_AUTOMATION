name: SolePick Caption Generation

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube URL/ID or permitted direct media URL"
        required: false
        type: string
        default: "https://www.youtube.com/watch?v=-upXWTgK1fo"
      video_id:
        description: "YouTube ID when using an uploaded media file"
        required: false
        type: string
        default: "-upXWTgK1fo"
      model:
        description: "Open-source Whisper model"
        required: true
        type: choice
        options:
          - tiny.en
          - base.en
          - small.en
          - medium.en
        default: small.en
  push:
    branches: [main]
    paths:
      - 'generate_captions.py'
      - '.github/workflows/generate-captions.yml'

permissions:
  contents: write

concurrency:
  group: solepick-caption-generation
  cancel-in-progress: false

jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg and open-source caption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp faster-whisper

      - name: Generate timed English captions
        env:
          VIDEO_URL: ${{ inputs.video_url || 'https://www.youtube.com/watch?v=-upXWTgK1fo' }}
          VIDEO_ID: ${{ inputs.video_id || '-upXWTgK1fo' }}
          WHISPER_MODEL: ${{ inputs.model || 'small.en' }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            python generate_captions.py --video-url="$VIDEO_URL" --video-id="$VIDEO_ID" --model="$WHISPER_MODEL"
          else
            echo "No media URL supplied. For YouTube-blocked videos, use the repository script locally with --media-file and --video-id."
            exit 1
          fi

      - name: Commit generated WebVTT captions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/
          if git diff --cached --quiet; then
            echo "No caption changes to commit."
          else
            git commit -m "Generate English captions for recipe video"
            git push
          fi
