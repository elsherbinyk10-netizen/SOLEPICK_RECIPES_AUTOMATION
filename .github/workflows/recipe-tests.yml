name: SolePick Recipe Quality Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: solepick-recipe-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp Pillow

      - name: Run recipe, trend, image and publishing regression tests
        run: python -m unittest discover -s tests -v
